name: flutter_resihub
description: ResiHub Property Management v2.0 (Flutter Parallel Client)
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  image: ^4.3.0
  printing: ^5.13.4
  pdfx: ^2.8.0
  web: ^1.1.0
  super_clipboard: ^0.8.24
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  fl_chart: ^0.70.2
  lucide_icons_flutter: ^3.0.0
  shimmer: ^3.0.0
  intl: any
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
