services:
  postgres:
    image: postgres:16-alpine
    container_name: resihub-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resihub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resihub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: resihub-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resihub}
      JWT_SECRET: ${JWT_SECRET:-resihub_dev_jwt_secret_key_very_secure_12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-resihub_dev_jwt_refresh_secret_key_very_secure_67890}
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resihub-frontend
    restart: always
    environment:
      VITE_API_URL: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
